<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방과 후 축제 준비 명단 — 15회 잔디고등학교 축제</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
  --desk:#2f4038;
  --desk-line:rgba(255,255,255,.06);
  --paper:#e8e4d8;
  --ink:#1e1c18;
  --muted:#6f6a5d;
  --rule:#b9b3a1;
  --red:#8f2f22;
  --green:#3a5c48;
  --tape:rgba(240,232,200,.55);
  --bar:62px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--desk);
  background-image:
    repeating-linear-gradient(0deg,transparent 0 31px,var(--desk-line) 31px 32px),
    repeating-linear-gradient(90deg,transparent 0 31px,var(--desk-line) 31px 32px);
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  -webkit-text-size-adjust:100%;
}

/* ── top bar ── */
.bar{
  position:fixed;top:0;left:0;right:0;min-height:var(--bar);z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 18px;color:#e5e1d4;
  pointer-events:none;
}
.bar::before{
  content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(47,64,56,.96) 60%,rgba(47,64,56,0));
}
.bar .title,.bar .tools{pointer-events:auto}
.bar .title{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.25}
.bar .title small{
  display:block;font-family:'Pretendard',sans-serif;font-size:11px;
  letter-spacing:.14em;color:rgba(229,225,212,.5);margin-top:2px;
}
.tools{display:flex;gap:7px;flex-shrink:0}
.tools button{
  font-family:'Noto Sans KR',sans-serif;font-size:12px;
  background:rgba(255,255,255,.09);color:#e5e1d4;border:1px solid rgba(255,255,255,.16);
  padding:8px 13px;border-radius:999px;cursor:pointer;transition:background .15s;
  min-height:38px;white-space:nowrap;
}
.tools button:hover,.tools button:focus-visible{background:rgba(255,255,255,.18);outline:none}
#bgmToggle{opacity:.55}
#bgmToggle.playing{opacity:1;background:rgba(255,205,130,.22);border-color:rgba(255,205,130,.5)}

/* ── desk (데스크톱: 드래그 보드) ── */
#desk{position:relative}
body.pin #desk{position:relative;min-height:100vh;touch-action:none}

.doc{
  cursor:grab;user-select:none;-webkit-user-select:none;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.4)) drop-shadow(0 2px 4px rgba(0,0,0,.3));
  transition:filter .18s ease;
}
body.pin .doc{position:absolute}
.doc:active{cursor:grabbing}
@media (hover:hover){.doc:hover{filter:drop-shadow(0 14px 28px rgba(0,0,0,.5)) drop-shadow(0 3px 6px rgba(0,0,0,.35))}}
.doc:focus-visible{outline:2px solid #f0e6b8;outline-offset:6px}

.tape{
  position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:74px;height:24px;background:var(--tape);
  border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08);
  box-shadow:0 1px 2px rgba(0,0,0,.15);
}
.rec{width:232px;background:var(--paper);border:1px solid var(--rule);padding:14px 14px 12px;position:relative}
.rec .head{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:'Pretendard',sans-serif;font-weight:400;font-size:11px;letter-spacing:.02em;
  color:var(--muted);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.rec .photo{
  margin:12px 0 10px;width:100%;aspect-ratio:1/1;border:1px solid var(--rule);
  background:repeating-linear-gradient(45deg,#c9c4b5 0 3px,#c2bdad 3px 6px);
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  font-family:'Bebas Neue',sans-serif;font-size:62px;color:rgba(255,255,255,.5);
  line-height:1;padding-bottom:6px;
}
.rec .photo img{width:100%;height:100%;object-fit:cover;
  -webkit-user-drag:none;user-drag:none;pointer-events:none}
.rec .idbox{}
.rec .nm{font-size:20px;font-weight:700}
.rec .rl{font-size:12.5px;color:var(--muted);margin-top:3px}
.rec .foot{
  margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule);
  font-family:'Pretendard',sans-serif;font-size:11px;letter-spacing:.01em;
  display:flex;justify-content:space-between;color:var(--muted);
}
.stat{border:1px solid currentColor;padding:1px 5px}
.st-ok{color:var(--green)} .st-warn{color:var(--red)}

.memo{width:196px;background:#e9e2b8;padding:16px 16px 20px;
  font-family:'Gaegu',cursive;font-size:17px;line-height:1.55;color:#3a3320}
.memo .mk{font-family:'Gaegu',cursive;font-size:14px;letter-spacing:.02em;color:#8b8154;margin-bottom:6px}

.pola{width:180px;background:#f2efe6;padding:12px 12px 34px}
.pola .im{aspect-ratio:1/1;overflow:hidden;background:repeating-linear-gradient(135deg,#8d9a8f 0 4px,#7f8c82 4px 8px);
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);
  font-family:'Bebas Neue',sans-serif;font-size:52px}
.pola .im img{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;user-drag:none;pointer-events:none}
.pola .cap{font-family:'Gaegu',cursive;font-size:15px;color:#4a453a;margin-top:10px;text-align:center}

/* ── 모바일: 흩어진 느낌 유지하되 세로 스크롤 ── */
@media (max-width:720px){
  #desk{
    padding:132px 0 90px;
    display:flex;flex-direction:column;align-items:center;gap:30px;
  }
  .doc{cursor:default;width:min(300px,84vw)}
  .rec,.memo,.pola{width:100%}
  .doc:nth-child(4n+1){align-self:flex-start;margin-left:7vw}
  .doc:nth-child(4n+3){align-self:flex-end;margin-right:7vw}
  .memo{font-size:19px}
}

/* ── modal ── */
.ov{
  position:fixed;inset:0;background:rgba(15,22,18,.82);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:60;
}
.ov.on{opacity:1;pointer-events:auto}
.file{
  width:100%;max-width:520px;max-height:86vh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--paper);border:1px solid #9c9686;
  padding:30px 30px 26px;position:relative;
  transform:translateY(14px) scale(.985);transition:transform .22s ease;
  box-shadow:0 24px 60px rgba(0,0,0,.55);
}
.ov.on .file{transform:none}
.file::before{
  content:'';position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(1.5deg);
  width:100px;height:26px;background:var(--tape);box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.x{position:absolute;top:14px;right:14px;width:40px;height:40px;
  background:none;border:1px solid var(--rule);color:var(--muted);cursor:pointer;font-size:15px}
.x:hover{border-color:var(--red);color:var(--red)}
.fh .por{float:right;width:172px;aspect-ratio:1/1;border:1px solid var(--rule);overflow:hidden;margin:0 0 8px 14px}
.fh .por img{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;user-drag:none}
.fh{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px;padding-right:44px}
.fh .no{font-family:'Pretendard',sans-serif;font-weight:500;font-size:11px;letter-spacing:.2em;color:var(--muted)}
.file h2{font-size:30px;font-weight:700;margin:5px 0 4px}
.fh .rl{font-size:12.5px;color:var(--muted)}
dl{display:grid;grid-template-columns:76px 1fr;gap:9px 16px;font-size:14px;line-height:1.7}
dt{font-family:'Pretendard',sans-serif;font-weight:500;font-size:12px;letter-spacing:.08em;color:var(--muted);padding-top:5px}
dd{color:#2b2823}
.quote{margin-top:20px;padding:14px 16px;border-left:3px solid var(--rule);
  font-family:'Gaegu',cursive;font-size:18px;line-height:1.6;color:#453f34}
.note{margin-top:18px;padding:14px;border:1px dashed var(--rule);background:rgba(255,255,255,.3);
  font-size:13.5px;line-height:1.85}
.note b{display:block;font-family:'Pretendard',sans-serif;font-weight:500;font-size:11px;
  letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
@media (max-width:720px){
  .bar .title{font-size:14px}
  .ov{padding:14px;align-items:flex-end}
  .file{padding:26px 20px 22px;max-height:90vh}
  .file h2{font-size:26px}
  .fh .por{width:118px;margin-left:12px}
  dl{grid-template-columns:66px 1fr;font-size:13.5px}
}

.hint{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:40;
  font-family:'Pretendard',sans-serif;font-size:11px;letter-spacing:.02em;
  color:rgba(229,225,212,.42);pointer-events:none;text-align:center;
}

/* ── 방과 후 색감: 오른쪽에서 스며드는 밝은 오후빛 ── */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:55;
  mix-blend-mode:screen;
  background:linear-gradient(100deg,
    transparent 34%,
    rgba(255,224,162,.12) 70%,
    rgba(255,207,134,.21) 100%);
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:54;
  mix-blend-mode:multiply;opacity:.6;
  background:linear-gradient(100deg, transparent 44%, rgba(208,163,103,.11) 100%);
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const desk=document.getElementById('desk'), items=[]; let z=1;
const MQ=matchMedia('(max-width:720px)');
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};

students.forEach((s,i)=>{
  const n=el(`<div class="doc" tabindex="0" role="button" aria-label="${s.name} 기록카드">
    <div class="tape"></div>
    <div class="rec">
      <div class="head"><span>학생기록카드</span><span>${s.no}</span></div>
      <div class="photo">${s.img?`<img src="${s.img}" alt="">`:(s.name==='???'?'?':s.name[0])}</div>
      <div class="idbox"><div class="nm">${s.name}</div><div class="rl">${s.role}</div></div>
      <div class="foot"><span>학생기록</span><span>${s.no}</span></div>
    </div></div>`);
  n.dataset.idx=i; items.push({n,doc:s});
});
props.forEach(p=>{
  const n = p.kind==='memo'
    ? el(`<div class="doc"><div class="memo"><div class="mk">${p.mark}</div>${p.text.replace(/\n/g,'<br>')}</div></div>`)
    : el(`<div class="doc"><div class="pola"><div class="im">${p.img?`<img src="${p.img}" alt="">`:p.glyph}</div><div class="cap">${p.cap}</div></div></div>`);
  items.push({n,doc:null});
});
// 학생/소품 섞어서 배치
items.sort(()=>Math.random()-.5).forEach(({n})=>desk.appendChild(n));

const rand=(a,b)=>a+Math.random()*(b-a);
function place(n,x,y,rot){n.style.left=x+'px';n.style.top=y+'px';n.style.transform=`rotate(${rot}deg)`}

function scatter(){
  if(MQ.matches){ items.forEach(({n})=>{n.style.transform=`rotate(${rand(-4,4)}deg)`;n.style.display=''}); return; }
  const W=innerWidth, cw=262, pad=20;
  const cols=Math.max(1,Math.floor((W-pad*2)/cw));
  const offX=(W-cols*cw)/2;
  const colY=new Array(cols).fill(96);   // 열마다 실제 높이를 누적
  items.forEach(({n},i)=>{
    n.style.display='';
    n.style.transform='rotate(0deg)';
    const c=i%cols;
    const h0=n.offsetHeight||270;
    place(n, offX+c*cw+rand(-16,16), colY[c]+rand(-8,8), rand(-7,7));
    colY[c]+=h0+34;
  });
  desk.style.height=(Math.max(...colY)+60)+'px';
}
function tidy(){
  if(MQ.matches){
    items.forEach(({n})=>{n.style.display='';n.style.transform='rotate(0deg)'});
    return;
  }
  const W=innerWidth,cw=262,pad=20;
  const cols=Math.max(1,Math.floor((W-pad*2)/cw));
  const offX=(W-cols*cw)/2;
  const colY=new Array(cols).fill(96);
  items.forEach(({n},i)=>{
    n.style.display='';n.style.transform='rotate(0deg)';
    const c=i%cols,h0=n.offsetHeight||270;
    place(n,offX+c*cw,colY[c],0);
    colY[c]+=h0+28;
  });
  desk.style.height=(Math.max(...colY)+60)+'px';
}
document.getElementById('shuffle').onclick=scatter;
document.getElementById('tidy').onclick=tidy;

function applyMode(){
  document.body.classList.toggle('pin',!MQ.matches);
  document.getElementById('hint').textContent =
    MQ.matches ? '카드를 눌러 기록을 엽니다' : '드래그해서 옮기고, 클릭하면 기록이 열립니다';
  if(!MQ.matches) scatter(); else items.forEach(({n})=>{n.style.left='';n.style.top='';n.style.transform=`rotate(${rand(-4,4)}deg)`});
}
MQ.addEventListener('change',applyMode);
addEventListener('resize',()=>{if(!MQ.matches)scatter()});

/* ── 입력: 드래그(데스크톱) / 탭(모바일) ── */
let drag=null;
desk.addEventListener('pointerdown',e=>{
  const n=e.target.closest('.doc'); if(!n)return;
  if(MQ.matches){drag={n,moved:false,tapOnly:true};return}
  n.style.zIndex=++z;
  drag={n,dx:e.clientX-n.offsetLeft,dy:e.clientY-n.offsetTop,moved:false};
  n.setPointerCapture(e.pointerId);
});
desk.addEventListener('pointermove',e=>{
  if(!drag||drag.tapOnly)return;
  drag.moved=true;
  drag.n.style.left=(e.clientX-drag.dx)+'px';
  drag.n.style.top=(e.clientY-drag.dy)+'px';
});
desk.addEventListener('pointerup',()=>{
  if(!drag)return; const {n,moved}=drag; drag=null;
  if(!moved && n.dataset.idx!==undefined) openFile(+n.dataset.idx);
});
desk.addEventListener('pointercancel',()=>drag=null);
desk.addEventListener('dragstart',e=>e.preventDefault());
desk.addEventListener('keydown',e=>{
  const n=e.target.closest('.doc');
  if(n&&n.dataset.idx!==undefined&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openFile(+n.dataset.idx)}
});

/* ── 모달 ── */
const ov=document.getElementById('ov');let last=null,scrollY=0;
function playPaper(){
  const a=document.getElementById('sfxPaper');
  if(!a)return;
  try{ a.currentTime=0; a.play(); }catch(e){}
}
function playPaperClose(){
  const a=document.getElementById('sfxPaperClose');
  if(!a)return;
  try{ a.currentTime=0; a.play(); }catch(e){}
}
function openFile(i){
  const s=students[i];last=document.activeElement;
  ov._openedAt=Date.now();
  playPaper();
  fNo.textContent=`NO. ${s.no}`;
  fName.textContent=s.name; fRole.textContent=s.role;
  const pw=document.getElementById('fPor');
  pw.innerHTML = s.img ? `<img src="${s.img}" alt="">` : '';
  pw.style.display = s.img ? '' : 'none';
  fBody.innerHTML=Object.entries(s.fields).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
  fQuote.textContent=s.quote?`"${s.quote}"`:'';
  fQuote.style.display=s.quote?'':'none';
  fNote.textContent=s.note||'';
  document.getElementById('fNoteBox').style.display=s.note?'':'none';
  if(MQ.matches){scrollY=window.scrollY;document.body.style.position='fixed';document.body.style.top=-scrollY+'px';document.body.style.width='100%'}
  ov.classList.add('on'); x.focus();
}
function closeFile(){
  playPaperClose();
  ov.classList.remove('on');
  if(MQ.matches){document.body.style.position='';document.body.style.top='';document.body.style.width='';window.scrollTo(0,scrollY)}
  last&&last.focus&&last.focus();
}
x.onclick=closeFile;
ov.onclick=e=>{if(e.target===ov){ if(Date.now()-(ov._openedAt||0)<350) return; closeFile(); }};
addEventListener('keydown',e=>{if(e.key==='Escape')closeFile()});

applyMode();

/* ── 배경음: 첫 상호작용에 시작, 버튼으로 토글 ── */
(function(){
  const bgm=document.getElementById('bgm');
  const btn=document.getElementById('bgmToggle');
  if(!bgm||!btn)return;
  bgm.volume=0.0;
  let started=false, userMuted=false;
  function fadeTo(target,ms){
    const steps=20, step=(target-bgm.volume)/steps; let i=0;
    clearInterval(bgm._fade);
    bgm._fade=setInterval(()=>{
      i++; bgm.volume=Math.max(0,Math.min(1,bgm.volume+step));
      if(i>=steps){clearInterval(bgm._fade); bgm.volume=target;}
    }, ms/steps);
  }
  function start(){
    if(started||userMuted)return;
    started=true;
    bgm.play().then(()=>{ fadeTo(0.7,1200); setPlaying(true); })
             .catch(()=>{ started=false; });
  }
  function setPlaying(on){
    btn.classList.toggle('playing',on);
    btn.setAttribute('aria-pressed', on?'true':'false');
    btn.textContent = on ? '♪ 소리 끄기' : '♪ 소리';
  }
  // 첫 상호작용(클릭/터치/키/드래그)에서 자동 시작
  function autostart(e){
    // 토글 버튼에서 시작된 상호작용은 버튼 핸들러에 맡김
    if(e && e.target && e.target.closest && e.target.closest('#bgmToggle')) return;
    start();
  }
  ['pointerdown','keydown','touchstart'].forEach(ev=>
    window.addEventListener(ev, autostart, {once:false, passive:true}));
  // 버튼으로 토글
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    if(started && !bgm.paused){
      userMuted=true; fadeTo(0,500);
      setTimeout(()=>bgm.pause(),520); started=false; setPlaying(false);
    }else{
      userMuted=false; started=true;
      bgm.play().then(()=>{fadeTo(0.7,800); setPlaying(true);}).catch(()=>{started=false;});
    }
  });
})();

</script>
